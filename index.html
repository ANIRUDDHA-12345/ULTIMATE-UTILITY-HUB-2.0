    function calculatorHTML(){const scientific=['sin','cos','tan','sqrt','log','(',')','^','π','e'];const keys=['MC','MR','M+','MS','⌫','sin','cos','tan','sqrt','log','(',')','^','π','e','÷','7','8','9','×','AC','4','5','6','−','%','1','2','3','+','Ans','0','.','+/-','='];return `<div class="calc"><div class="inline" style="justify-content:space-between"><h2>${state.calcScientific?'Scientific':'Standard'} calculator</h2><button class="btn small" data-action="calc-mode">Switch to ${state.calcScientific?'standard':'scientific'}</button></div><div class="calc-display"><div class="calc-expression" id="calcExpr">${esc(state.calcExpr)||' '}</div><div class="calc-value" id="calcValue">${esc(state.calcResult)}</div></div><div class="calc-grid">${keys.map(x=>`<button class="calc-key ${['÷','×','−','+','^','=','%'].includes(x)?'op':''} ${x==='='?'equal':''} ${scientific.includes(x)&&!state.calcScientific?'hidden':''}" data-calc="${x}">${x}</button>`).join('')}</div><div class="actions"><button class="btn small" data-action="calc-copy">${icon('copy')} Copy result</button><button class="btn small" data-action="calc-history">Show history</button></div><div id="calcHistory" class="hidden"></div><p class="muted" style="font-size:11px">Keyboard: numbers and operators, Enter to calculate, Backspace to delete. Memory: MC clears, MR recalls, M+ adds, MS stores.</p></div>`}

    function clockCards(){return state.clockZones.map(z=>{let city=z.split('/').pop().replace(/_/g,' '),tm='';try{tm=new Intl.DateTimeFormat(undefined,{timeZone:z,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:!state.clock24}).format(new Date())}catch{tm='Invalid time zone'}return `<div class="clock-card"><div class="inline" style="justify-content:space-between"><div><div class="clock-city">${esc(city)}</div><div class="clock-zone">${esc(z)}</div></div><button class="favorite" data-zone-remove="${esc(z)}" aria-label="Remove ${esc(city)}">×</button></div><div class="clock-time">${esc(tm)}</div><div class="clock-date">${esc(new Intl.DateTimeFormat(undefined,{timeZone:z,weekday:'long',month:'short',day:'numeric'}).format(new Date()))}</div></div>`}).join('')}

    function calendarHTML(){
      const d=state.calendarDate,y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1),offset=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),prevDays=new Date(y,m,0).getDate();let cells='';
      for(let i=0;i<42;i++){
        let day,month=m,year=y,dim=false;
        if(i<offset){day=prevDays-offset+i+1;month=m-1;dim=true}else if(i>=offset+days){day=i-offset-days+1;month=m+1;dim=true}else day=i-offset+1;
        const date=new Date(year,month,day),key=dateKey(date),today=key===dateKey(new Date()),ev=state.events.filter(e=>e.date===key);
        cells+=`<div class="calendar-cell ${dim?'dim':''} ${today?'today':''}" data-cal-date="${key}" role="button" tabindex="0" aria-label="Add event on ${esc(date.toLocaleDateString())}"><strong>${day}</strong>${ev.slice(0,2).map(e=>`<div class="calendar-event" title="${esc(e.title)}">${esc(e.title)}</div>`).join('')}</div>`
      }
      const upcoming=state.events.filter(e=>e.date>=dateKey(new Date())).sort((a,b)=>a.date.localeCompare(b.date));
      return `<div class="inline" style="justify-content:space-between"><h2>Calendar & reminders</h2><button class="btn primary" data-action="event-add">${icon('plus')} Add event</button></div><div class="month-head"><button class="btn small" data-action="month-prev" aria-label="Previous month">‹</button><div class="month-title">${d.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</div><button class="btn small" data-action="month-next" aria-label="Next month">›</button></div><div class="calendar-grid">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(w=>`<div class="calendar-cell heading">${w}</div>`).join('')}${cells}</div><div class="divider"></div><h3>Upcoming events</h3><input class="input" id="eventSearch" placeholder="Search events..." aria-label="Search events">${upcoming.map(e=>`<div class="lap-row event-row"><span>${esc(e.date)}</span><strong>${esc(e.title)}</strong><button class="favorite" data-event-edit="${esc(e.id)}" aria-label="Edit ${esc(e.title)}">${icon('edit')}</button><button class="favorite" data-event-delete="${esc(e.id)}" aria-label="Delete ${esc(e.title)}">${icon('trash')}</button></div>`).join('')||'<div class="empty">No upcoming events. Select “Add event” to create a reminder.</div>'}`
    }

    function notesHTML(){const note=state.notes.find(n=>n.id===state.selectedNote);return `<h2>Private notes</h2><div class="note-layout"><div><button class="btn primary small" data-action="note-new" style="width:100%;margin-bottom:10px">${icon('plus')} New note</button><input class="input" id="noteSearch" placeholder="Search notes...">${state.notes.length?`<div class="note-list">${state.notes.slice().sort((a,b)=>Number(b.pinned)-Number(a.pinned)||Number(b.favorite)-Number(a.favorite)||b.updated-a.updated).map(n=>`<div class="note-item ${note?.id===n.id?'active':''}" data-note-select="${n.id}"><strong>${n.pinned?'📌 ':''}${n.favorite?'★ ':''}${esc(n.title||'Untitled note')}</strong><small>${esc(n.category||'General')} · ${new Date(n.updated).toLocaleDateString()}</small></div>`).join('')}</div>`:'<div class="empty" style="margin-top:10px">No notes yet. Create a note to get started.</div>'}</div>${note?`<div class="note-editor"><div class="inline"><input class="input" id="noteTitle" value="${esc(note.title)}" placeholder="Note title"><button class="btn small" data-action="note-pin">${note.pinned?'Unpin':'Pin'}</button><button class="btn small" data-action="note-favorite">${note.favorite?'Unfavorite':'Favorite'}</button><button class="btn small danger" data-action="note-delete">${icon('trash')}</button></div><div class="row"><div class="field"><label>Category</label><input class="input" id="noteCategory" value="${esc(note.category||'General')}"></div><span class="muted" style="font-size:11px">Auto-saves as you type</span></div><textarea class="textarea" id="noteBody" placeholder="Start writing...">${esc(note.body)}</textarea><div class="subresult">Created ${new Date(note.created).toLocaleString()} · Updated ${new Date(note.updated).toLocaleString()}</div><div class="actions"><button class="btn small" data-action="notes-export">${icon('download')} Export notes</button><button class="btn small" data-action="notes-import">${icon('external')} Import notes</button><input class="hidden" id="notesFile" type="file" accept=".json,application/json"></div></div>`:`<div class="empty">Select a note or create one. Notes are stored in this browser on this device.</div>`}</div>`}

    function percentageHTML(){return `<h2>Percentage & interest tools</h2><div class="row"><div class="field"><label>What is</label><input class="input" id="percentA" type="number" placeholder="15"></div><div class="field"><label>% of</label><input class="input" id="percentB" type="number" placeholder="200"></div><button class="btn primary" data-action="percent-of">Calculate</button></div><div class="subresult" id="percentResult"></div><div class="divider"></div><h3>Discount calculator</h3><div class="row"><div class="field"><label>Original price</label><input class="input" id="discountPrice" type="number"></div><div class="field"><label>Discount (%)</label><input class="input" id="discountPct" type="number"></div><button class="btn" data-action="discount-calc">Calculate</button></div><div class="subresult" id="discountResult"></div><div class="divider"></div><h3>Interest calculator</h3><div class="row"><div class="field"><label>Principal</label><input class="input" id="interestPrincipal" type="number"></div><div class="field"><label>Annual rate (%)</label><input class="input" id="interestRate" type="number"></div><div class="field"><label>Years</label><input class="input" id="interestYears" type="number"></div><div class="field"><label>Type</label><select class="select" id="interestType"><option value="simple">Simple</option><option value="compound">Compound (annual)</option></select></div><button class="btn" data-action="interest-calc">Calculate</button></div><div class="subresult" id="interestResult"></div>`}

    function settingsPage(){return `${header('Settings','Personalize your workspace and manage your local data.')}<div class="settings-grid"><div class="setting-card"><h3>Appearance</h3><p>Set a theme and accent color for the workspace.</p><div class="field"><label>Theme</label><select class="select" id="settingTheme"><option value="dark" ${state.theme==='dark'?'selected':''}>Dark</option><option value="light" ${state.theme==='light'?'selected':''}>Light</option></select></div><div class="field"><label>Accent color</label><select class="select" id="settingAccent"><option value="purple" ${!state.settings.accent||state.settings.accent==='purple'?'selected':''}>Violet</option><option value="blue" ${state.settings.accent==='blue'?'selected':''}>Ocean blue</option><option value="green" ${state.settings.accent==='green'?'selected':''}>Emerald</option><option value="rose" ${state.settings.accent==='rose'?'selected':''}>Rose</option></select></div><label class="inline"><input class="checkbox" id="settingCompact" type="checkbox" ${state.settings.compact?'checked':''}> Compact layout</label></div><div class="setting-card"><h3>Preferences</h3><p>Choose how time and notifications appear.</p><label class="inline"><input class="checkbox" id="setting24" type="checkbox" ${state.settings.clock24?'checked':''}> Use 24-hour time</label><div style="height:12px"></div><label class="inline"><input class="checkbox" id="settingNotifications" type="checkbox" ${state.settings.notifications!==false?'checked':''}> Timer completion notifications</label><div style="height:12px"></div><label class="inline"><input class="checkbox" id="settingSound" type="checkbox" ${state.settings.sound?'checked':''}> Play a sound when a timer completes</label></div><div class="setting-card"><h3>Your data</h3><p>Your information stays in this browser. Export a backup or restore a previous one.</p><div class="actions"><button class="btn small" data-action="data-export">${icon('download')} Export data</button><button class="btn small" data-action="data-import">${icon('external')} Import data</button><input class="hidden" type="file" id="dataFile" accept=".json,application/json"><button class="btn small danger" data-action="data-clear">${icon('trash')} Clear all data</button></div></div><div class="setting-card"><h3>Keyboard shortcuts</h3><p><kbd>Ctrl</kbd> / <kbd>⌘</kbd> + <kbd>K</kbd> &nbsp; Open global search<br><kbd>Esc</kbd> &nbsp; Close search<br><kbd>Enter</kbd> &nbsp; Activate selected search result<br>Calculator: number keys, operators, <kbd>Enter</kbd>, <kbd>Backspace</kbd></p><button class="btn small" data-page="help">Full help & shortcuts</button></div><div class="setting-card"><h3>Privacy & security</h3><p>No account, analytics, or server-side storage. Keep your device protected and export backups regularly.</p><button class="btn small" data-page="privacy">Read privacy details</button></div><div class="setting-card"><h3>About this app</h3><p>Ultimate Utility Hub 2.0 · One Workspace. Limitless Possibilities.</p><button class="btn small" data-page="about">About the project</button></div></div>`}
    function infoPage(page){
      if(page==='privacy')return `${header('Privacy, by default','Your personal data should belong to you.')}<div class="panel"><h2>How your data is handled</h2><p>The app runs in your browser. Notes, events, tasks, and reading list items use IndexedDB where available, with local storage as a fallback. Preferences, favorites, counters, and timers use local storage. No account or server-side data store is used.</p><p>Passwords use your browser’s cryptographic random-number generator and are never saved. QR codes are generated locally. Imported files are validated and treated only as data.</p><p>Browser storage is not encrypted. Anyone with access to this browser profile may be able to access locally stored data. Export a backup before clearing site data; exported files are readable and should be kept private.</p><p>Offline caching stores only the application shell, never personal workspace data. You can clear app data from Settings.</p></div>`;
      if(page==='about')return `${header('One Workspace. Limitless Possibilities.','A compact collection of utilities designed to stay simple, useful, and private.')}<div class="panel"><h2>Ultimate Utility Hub 2.0</h2><p>Twenty everyday, timekeeping, planning, writing, and developer utilities in one responsive workspace.</p><p>Built with browser-native web technologies. No sign-in, paid API, analytics, or cloud account is required. Core tools run locally.</p><p>Made for people who value a calm interface and useful tools without unnecessary friction.</p></div>`;
      return `${header('Help & keyboard shortcuts','A few quick tips for using your local workspace.')}<div class="panel"><h2>Getting started</h2><p>Use the sidebar to browse tools, click a star to add a favorite, or press <kbd>Ctrl</kbd> + <kbd>K</kbd> to search by name, category, or description. Your recently opened tools appear in the Recent view.</p><p>Notes auto-save as you type. Use Settings to export a backup before clearing data. Data is saved in this browser only.</p><h3>Keyboard shortcuts</h3><p><kbd>Ctrl</kbd>/<kbd>⌘</kbd> + <kbd>K</kbd> opens search. Use Up/Down to navigate results, Enter to open, and Escape to close. In Calculator Studio, use normal arithmetic keys, Enter, and Backspace. In the stopwatch, Space toggles start/pause, L records a lap, and R resets.</p><h3>Offline use</h3><p>Serve the app over localhost or HTTPS once to enable offline installation. Service workers are not available when opening the HTML file directly.</p></div>`
    }
    function render(){document.documentElement.dataset.theme=state.theme;renderNav();document.getElementById('breadcrumb').textContent='Workspace / '+pageTitle(state.page);const v=document.getElementById('view');if(state.page==='home')v.innerHTML=home();else if(state.page==='tools')v.innerHTML=`${header('All tools','Browse every utility, grouped by what you need to do.')}<div class="cat-pills">${['All',...categories].map(c=>`<button class="pill ${state.category===c?'active':''}" data-category="${c}">${c}</button>`).join('')}</div>${grid(state.category==='All'?tools:tools.filter(t=>t.category===state.category))}`;else if(state.page==='favorites')v.innerHTML=`${header('Your favorites','Tools you have pinned for quick access.')}${grid(tools.filter(t=>state.favorites.includes(t.id)))}`;else if(state.page==='recent')v.innerHTML=`${header('Recently used','Your recent tools are saved only in this browser.')}<div class="actions" style="margin-bottom:14px"><button class="btn small" data-action="clear-recent">Clear history</button></div>${grid(state.recent.map(toolById).filter(Boolean))}`;else if(state.page==='settings')v.innerHTML=settingsPage();else if(['about','privacy','help'].includes(state.page))v.innerHTML=infoPage(state.page);else v.innerHTML=toolPage()||`${header('Page not found','The page you requested does not exist.')}<button class="btn primary" data-page="home">Return to dashboard</button>`;iconify();if(state.page==='converter')initConverter();if(state.page==='text-studio')updateTextCounts();if(state.page==='stopwatch')updateWatch();if(state.page==='world-clock')startClocks();if(state.page==='notes')setTimeout(()=>document.getElementById('noteSearch')?.focus({preventScroll:true}),0);syncThemeButton()}
    function syncThemeButton(){const el=document.querySelector('#themeToggle [data-icon]');if(el){el.dataset.icon=state.theme==='dark'?'sun':'moon';el.innerHTML=icon(el.dataset.icon)}}
    function initConverter(){const c=document.getElementById('convCategory');const fill=()=>{const options=Object.keys(units[c.value]).map(u=>`<option>${esc(u)}</option>`).join('');document.getElementById('convFrom').innerHTML=options;document.getElementById('convTo').innerHTML=options;document.getElementById('convTo').selectedIndex=Math.min(1,Object.keys(units[c.value]).length-1);convertUnits()};c.onchange=fill;document.getElementById('convValue').oninput=convertUnits;document.getElementById('convFrom').onchange=convertUnits;document.getElementById('convTo').onchange=convertUnits;document.getElementById('convSwap').onclick=()=>{const a=document.getElementById('convFrom'),b=document.getElementById('convTo'),n=a.selectedIndex;a.selectedIndex=b.selectedIndex;b.selectedIndex=n;convertUnits()};fill()}
    function convertUnits(){const category=document.getElementById('convCategory').value,from=document.getElementById('convFrom').value,to=document.getElementById('convTo').value,val=Number(document.getElementById('convValue').value);if(!Number.isFinite(val))return;let result;if(category==='Temperature'){const c=from==='Celsius'?val:from==='Fahrenheit'?(val-32)*5/9:val-273.15;result=to==='Celsius'?c:to==='Fahrenheit'?c*9/5+32:c+273.15}else result=val*units[category][from]/units[category][to];document.getElementById('convResult').textContent=`${Number(result.toPrecision(10))} ${to}`}

        case'password-generate':{const sets=[];if(byId('pwUpper').checked)sets.push('ABCDEFGHIJKLMNOPQRSTUVWXYZ');if(byId('pwLower').checked)sets.push('abcdefghijklmnopqrstuvwxyz');if(byId('pwNumbers').checked)sets.push('0123456789');if(byId('pwSymbols').checked)sets.push('!@#$%^&*()-_=+[]{}:,.?');if(!sets.length)return toast('Choose at least one character set.');const len=Number(byId('pwLength').value),all=sets.join('');let pw=sets.map(s=>s[randomInt(0,s.length-1)]);while(pw.length<len)pw.push(all[randomInt(0,all.length-1)]);for(let i=pw.length-1;i>0;i--){const j=randomInt(0,i);[pw[i],pw[j]]=[pw[j],pw[i]]}byId('passwordOutput').value=pw.join('');const score=Math.min(100,Math.round(len*1.5+sets.length*10));byId('pwStrength').style.width=score+'%';byId('pwStrength').style.background=score>80?'var(--success)':score>55?'#e6b964':'var(--danger)';byId('pwStrengthText').textContent=score>80?'Strong':score>55?'Good':'Consider a longer password';break}
        case'password-copy':if(byId('passwordOutput').value)copy(byId('passwordOutput').value);else toast('Generate a password first.');break;
        case'qr-generate':{const text=byId('qrInput').value;if(!text)return toast('Enter text or a URL first.');try{const canvas=makeQr(text,Number(byId('qrSize').value));const result=byId('qrResult');result.innerHTML='';result.append(canvas);canvas.id='qrCanvas';canvas.style.width=byId('qrSize').value+'px';canvas.style.maxWidth='100%';canvas.style.height='auto';const b=document.createElement('button');b.className='btn small';b.style.display='block';b.style.margin='12px auto';b.textContent='Download PNG';b.onclick=()=>{const a=document.createElement('a');a.download='qr-code.png';a.href=canvas.toDataURL('image/png');a.click()};result.append(b)}catch(e){toast(e.message)}break}
        case'note-new':{const n={id:crypto.randomUUID(),title:'',body:'',category:'General',created:Date.now(),updated:Date.now(),pinned:false,favorite:false};state.notes.unshift(n);state.selectedNote=n.id;persist('notes').then(()=>render());break}
        case'note-pin':{const n=state.notes.find(n=>n.id===state.selectedNote);if(n){n.pinned=!n.pinned;persist('notes');render()}break}
        case'note-favorite':{const n=state.notes.find(n=>n.id===state.selectedNote);if(n){n.favorite=!n.favorite;persist('notes');render()}break}
        case'note-delete':if(confirm('Delete this note? This cannot be undone.')){state.notes=state.notes.filter(n=>n.id!==state.selectedNote);state.selectedNote=null;persist('notes');render()}break;
        case'notes-export':download('utility-hub-notes.json',JSON.stringify(state.notes,null,2),'application/json');break;
        case'notes-import':byId('notesFile').click();break;
        case'json-format':case'json-minify':{try{const parsed=JSON.parse(byId('jsonInput').value);byId('jsonOutput').textContent=JSON.stringify(parsed,null,action==='json-format'?2:0);byId('jsonStatus').textContent='Valid JSON';byId('jsonStatus').className='subresult success'}catch(e){byId('jsonStatus').textContent=e.message;byId('jsonStatus').className='subresult danger-text'}break}
        case'json-copy':copy(byId('jsonOutput').textContent);break;
        case'json-download':download('formatted.json',byId('jsonOutput').textContent,'application/json');break;
        case'json-clear':byId('jsonInput').value='';byId('jsonOutput').textContent='';byId('jsonStatus').textContent='';break;
        case'codec-copy':copy(byId('codecOutput').textContent);break;
        case'codec-clear':byId('codecInput').value='';byId('codecOutput').textContent='';break;
        case'counter-plus':state.counter++;save('counter',state.counter);byId('counterValue').textContent=state.counter;break;
        case'counter-minus':state.counter--;save('counter',state.counter);byId('counterValue').textContent=state.counter;break;
        case'counter-reset':if(confirm('Reset the counter to zero?')){state.counter=0;save('counter',0);byId('counterValue').textContent=0}break;
        case'random-number':{const min=Number(byId('randomMin').value),max=Number(byId('randomMax').value);if(!Number.isSafeInteger(min)||!Number.isSafeInteger(max)||min>max)return toast('Enter a valid integer range.');byId('randomResult').textContent=randomInt(min,max);break}
        case'random-choice':{const choices=byId('choiceInput').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!choices.length)return toast('Add at least one choice.');byId('choiceResult').textContent=choices[randomInt(0,choices.length-1)];break}
        case'percent-of':{const a=Number(byId('percentA').value),b=Number(byId('percentB').value);byId('percentResult').textContent=`${a}% of ${b} = ${b*a/100}`;break}
        case'discount-calc':{const p=Number(byId('discountPrice').value),d=Number(byId('discountPct').value);if(p<0||d<0||d>100)return toast('Enter a price ≥ 0 and a discount from 0 to 100.');byId('discountResult').textContent=`You save ${(p*d/100).toFixed(2)} · Sale price ${(p*(1-d/100)).toFixed(2)}`;break}
        case'interest-calc':{const p=Number(byId('interestPrincipal').value),r=Number(byId('interestRate').value)/100,y=Number(byId('interestYears').value);if(p<0||r<0||y<0)return toast('Values must be zero or greater.');const amount=byId('interestType').value==='simple'?p*(1+r*y):p*Math.pow(1+r,y);byId('interestResult').textContent=`Final amount ${amount.toFixed(2)} · Interest earned ${(amount-p).toFixed(2)}`;break}
        case'date-diff-calc':{const a=byId('dateA').value,b=byId('dateB').value;if(!a||!b)return toast('Choose both dates.');const days=Math.round(Math.abs(new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);byId('dateDiffResult').textContent=`${days.toLocaleString()} days`;byId('dateDiffDetail').textContent=`${Math.floor(days/7)} weeks and ${days%7} days${a>b?' · Start date is after end date':''}`;break}
        case'reading-add':{const title=byId('readingTitle').value.trim();if(!title)return toast('Add a title first.');state.reading.push({id:crypto.randomUUID(),title,author:byId('readingAuthor').value.trim(),done:false});persist('reading');render();break}
        case'task-add':{const text=byId('taskInput').value.trim();if(!text)return toast('Enter a task first.');state.tasks.push({id:crypto.randomUUID(),text,done:false,date:new Date().toISOString().slice(0,10)});persist('tasks');render();break}
        case'task-clear-done':if(state.tasks.some(t=>t.done)&&confirm('Remove all completed tasks?')){state.tasks=state.tasks.filter(t=>!t.done);persist('tasks');render()}break;
        case'data-export':exportData();break;
        case'data-import':byId('dataFile').click();break;
        case'data-clear':if(confirm('Clear all Ultimate Utility Hub data stored in this browser? This cannot be undone.')){Promise.all(['notes','events','tasks','reading'].map(k=>dbSet(k,[]))).then(()=>{['favorites','recent','settings','zones','counter','timers'].forEach(k=>localStorage.removeItem('uuh-'+k));location.reload()}).catch(e=>{console.error(e);toast('Unable to clear all data')})}break;
      }
    }
    document.addEventListener('click',e=>{
      const page=e.target.closest('[data-page]');if(page){setPage(page.dataset.page);return}
      if(e.target.closest('#watchToggle')){const button=e.target.closest('#watchToggle'),lapButton=document.querySelector('[data-action="watch-lap"]');if(state.stopwatch.running){state.stopwatch.elapsed=watchMs();state.stopwatch.running=false;cancelAnimationFrame(watchFrame);watchFrame=0;button.textContent='Resume';if(lapButton)lapButton.disabled=true}else{state.stopwatch.started=performance.now();state.stopwatch.running=true;button.textContent='Pause';if(lapButton)lapButton.disabled=false;updateWatch()}return}
      const category=e.target.closest('[data-category]');if(category){state.category=category.dataset.category;state.page='tools';render();return}
      const favorite=e.target.closest('[data-favorite]');if(favorite){e.stopPropagation();toggleFavorite(favorite.dataset.favorite);return}
      const open=e.target.closest('[data-open-tool]');if(open){setPage(open.dataset.openTool);return}
      const calc=e.target.closest('[data-calc]');if(calc){calcPress(calc.dataset.calc);return}
      const action=e.target.closest('[data-action]');if(action){handleAction(action.dataset.action,action);return}
      const preset=e.target.closest('[data-preset]');if(preset){document.getElementById('timerMinutes').value=preset.dataset.preset;document.getElementById('timerSeconds').value=0;document.getElementById('timerName').value=`${preset.dataset.preset} minute timer`;return}
      const timer=e.target.closest('[data-timer-act]');if(timer){const t=state.timers.find(x=>x.id===timer.dataset.timer);if(!t)return;if(timer.dataset.timerAct==='delete'){if(!confirm(`Delete the timer “${t.name}”?`))return;state.timers=state.timers.filter(x=>x.id!==t.id)}else if(timer.dataset.timerAct==='reset'){t.running=false;t.remaining=t.initial||t.remaining;delete t.endsAt}else if(timer.dataset.timerAct==='pause'){t.remaining=Math.max(0,Math.ceil((t.endsAt-Date.now())/1000));t.running=false;delete t.endsAt}else{if(t.remaining<=0)return toast('Reset this timer before starting it.');t.running=true;t.endsAt=Date.now()+t.remaining*1000}saveTimers();render();return}
      const removeZone=e.target.closest('[data-zone-remove]');if(removeZone){state.clockZones=state.clockZones.filter(z=>z!==removeZone.dataset.zoneRemove);save('zones',state.clockZones);render();return}
      const eventEdit=e.target.closest('[data-event-edit]');if(eventEdit){handleAction('event-edit',eventEdit);return}
      const eventDel=e.target.closest('[data-event-delete]');if(eventDel){const event=state.events.find(x=>x.id===eventDel.dataset.eventDelete);if(event&&confirm(`Delete the event “${event.title}”?`)){state.events=state.events.filter(x=>x.id!==event.id);persist('events');render()}return}
      const note=e.target.closest('[data-note-select]');if(note){state.selectedNote=note.dataset.noteSelect;render();return}
      const tr=e.target.closest('[data-text-transform]');if(tr){const el=document.getElementById('textInput');const mode=tr.dataset.textTransform;el.value=mode==='uppercase'?el.value.toUpperCase():mode==='lowercase'?el.value.toLowerCase():mode==='title case'?el.value.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase()):mode==='remove extra spaces'?el.value.replace(/\s+/g,' ').trim():[...el.value].reverse().join('');updateTextCounts();return}
      const codec=e.target.closest('[data-codec]');if(codec){const inp=document.getElementById('codecInput').value,out=document.getElementById('codecOutput');try{out.textContent=codec.dataset.codec==='encode'?bytesToBase64(inp):codec.dataset.codec==='decode'?base64ToBytes(inp):codec.dataset.codec==='url-encode'?encodeURIComponent(inp):decodeURIComponent(inp)}catch(err){out.textContent=`Invalid input: ${err.message}`}return}
      const readDel=e.target.closest('[data-reading-delete]');if(readDel){const item=state.reading.find(x=>x.id===readDel.dataset.readingDelete);if(item&&confirm(`Remove “${item.title}” from the reading list?`)){state.reading=state.reading.filter(x=>x.id!==item.id);persist('reading');render()}return}
      const taskDel=e.target.closest('[data-task-delete]');if(taskDel){const task=state.tasks.find(x=>x.id===taskDel.dataset.taskDelete);if(task&&confirm(`Delete the task “${task.text}”?`)){state.tasks=state.tasks.filter(x=>x.id!==task.id);persist('tasks');render()}return}
      const day=e.target.closest('[data-cal-date]');if(day){const date=day.dataset.calDate,title=prompt(`Add a reminder for ${date}:`);if(title?.trim()){state.events.push({id:crypto.randomUUID(),date,title:title.trim()});persist('events');render()}return}
      const copyTarget=e.target.closest('[data-copy-target]');if(copyTarget){copy(document.getElementById(copyTarget.dataset.copyTarget).textContent);return}
    });
    document.addEventListener('change',e=>{if(e.target.matches('[data-task-done]')){const t=state.tasks.find(x=>x.id===e.target.dataset.taskDone);if(t){t.done=e.target.checked;persist('tasks')}}if(e.target.matches('[data-reading-done]')){const r=state.reading.find(x=>x.id===e.target.dataset.readingDone);if(r){r.done=e.target.checked;persist('reading');render()}}if(e.target.id==='settingTheme'){state.theme=e.target.value;localStorage.setItem('uuh-theme',state.theme);render()}if(e.target.id==='settingCompact'){state.settings.compact=e.target.checked;save('settings',state.settings);document.body.style.zoom=e.target.checked?'.97':'1'}if(e.target.id==='setting24'){state.settings.clock24=e.target.checked;state.clock24=e.target.checked;save('settings',state.settings)}if(e.target.id==='settingNotifications'){state.settings.notifications=e.target.checked;save('settings',state.settings);if(e.target.checked&&'Notification'in window&&Notification.permission==='default')Notification.requestPermission()}if(e.target.id==='settingSound'){state.settings.sound=e.target.checked;save('settings',state.settings)}if(e.target.id==='settingAccent'){document.documentElement.style.setProperty('--accent',({purple:'#a68bfa',blue:'#66b6f2',green:'#56c995',rose:'#ef82a7'})[e.target.value]);save('settings',{...state.settings,accent:e.target.value})}});
    document.addEventListener('input',e=>{if(e.target.id==='textInput')updateTextCounts();if(e.target.id==='pwLength')document.getElementById('pwLengthLabel').textContent=e.target.value;if(['noteTitle','noteCategory','noteBody'].includes(e.target.id)){clearTimeout(window.noteSaveTimeout);window.noteSaveTimeout=setTimeout(saveNote,250)}if(e.target.id==='noteSearch'){const q=e.target.value.toLowerCase();document.querySelectorAll('.note-item').forEach(n=>n.classList.toggle('hidden',!n.textContent.toLowerCase().includes(q)))}if(e.target.id==='eventSearch'){const q=e.target.value.toLowerCase();document.querySelectorAll('.event-row').forEach(n=>n.classList.toggle('hidden',!n.textContent.toLowerCase().includes(q)))}});
    document.addEventListener('change',e=>{if(e.target.id==='settingAccent'){const accent=state.settings.accent;if(accent)document.documentElement.style.setProperty('--accent',({purple:'#a68bfa',blue:'#66b6f2',green:'#56c995',rose:'#ef82a7'})[accent])}if(e.target.id==='notesFile'&&e.target.files[0]){const file=e.target.files[0];file.text().then(JSON.parse).then(async arr=>{if(!Array.isArray(arr)||arr.length>500||arr.some(n=>!n||typeof n.title!=='string'||typeof n.body!=='string'))throw Error('Invalid notes file');state.notes.push(...arr.map(n=>({...n,id:crypto.randomUUID()})));await persist('notes');render();toast('Notes imported')}).catch(err=>toast(`Import failed: ${err.message}`))}if(e.target.id==='dataFile'&&e.target.files[0])importData(e.target.files[0])});
    document.getElementById('searchOpen').onclick=modalSearch;document.getElementById('mobileSearch').onclick=modalSearch;document.getElementById('menuToggle').onclick=()=>document.getElementById('sidebar').classList.toggle('open');document.getElementById('themeToggle').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';localStorage.setItem('uuh-theme',state.theme);render()};
    window.addEventListener('keydown',e=>{
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();modalSearch()}
      if(e.key==='Escape')document.getElementById('overlay').innerHTML='';
      const inField=e.target.matches('input,textarea,select,[contenteditable="true"]');
      if(!inField&&e.target.matches('[data-open-tool]')&&(e.key==='Enter'||e.code==='Space')){e.preventDefault();e.target.click()}
      if(!inField&&e.target.matches('[data-cal-date]')&&(e.key==='Enter'||e.code==='Space')){e.preventDefault();e.target.click()}
      if(state.page==='stopwatch'&&!inField){if(e.code==='Space'){e.preventDefault();document.getElementById('watchToggle')?.click()}else if(e.key.toLowerCase()==='l'&&state.stopwatch.running)handleAction('watch-lap');else if(e.key.toLowerCase()==='r')handleAction('watch-reset')}
      if(state.page==='calculator'&&!inField&&!e.ctrlKey&&!e.metaKey){if(/^[0-9.+\-*/()%]$/.test(e.key)){calcPress(e.key)}else if(e.key==='Enter'){e.preventDefault();calcPress('=')}else if(e.key==='Backspace'){calcPress('⌫')}}
    });
    document.addEventListener('click',e=>{if(e.target.id==='dataFile')return});
    (async()=>{try{const cfg=state.settings;if(cfg.clock24)state.clock24=true;if(cfg.compact)document.body.style.zoom='.97';if(cfg.accent)document.documentElement.style.setProperty('--accent',({purple:'#a68bfa',blue:'#66b6f2',green:'#56c995',rose:'#ef82a7'})[cfg.accent]);await initData();state.timers.forEach(t=>{if(t.running&&!Number.isFinite(t.endsAt))t.endsAt=Date.now()+Math.max(0,t.remaining)*1000});render();startTimers();if('serviceWorker'in navigator&&location.protocol!=='file:'){const registration=await navigator.serviceWorker.register('./sw.js');registration.addEventListener('updatefound',()=>{const worker=registration.installing;if(worker)worker.addEventListener('statechange',()=>{if(worker.state==='installed'&&navigator.serviceWorker.controller)toast('A new version is ready. Refresh to update.')})})}}catch(e){console.error(e);render();toast('The workspace started with limited local storage')}})();
  })();
  </script>
